<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lilcryy | BIO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            background: url('https://www.google.com/imgres?q=%D1%84%D0%BB%D0%B0%D0%B3%20%D1%80%D0%BE%D1%81%D1%81%D0%B8b&imgurl=https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fthumb%2Ff%2Ff3%2FFlag_of_Russia.svg%2F2560px-Flag_of_Russia.svg.png&imgrefurl=https%3A%2F%2Fru.m.wikipedia.org%2Fwiki%2F%25D0%25A4%25D0%25B0%25D0%25B9%25D0%25BB%3AFlag_of_Russia.svg&docid=BcRaDu6-JOWUkM&tbnid=FbTiBunpHVkCAM&vet=12ahUKEwiwsY-ht5-OAxVqLhAIHZMuAekQM3oECB8QAA..i&w=2560&h=1707&hcb=2&ved=2ahUKEwiwsY-ht5-OAxVqLhAIHZMuAekQM3oECB8QAA') no-repeat center center fixed;
            background-size: cover;
            color: #f0e6d2;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }
        
        .content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 40px;
            background: rgba(20, 20, 20, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 4.5rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
        }
        
        .logo h1::after {
            content: '';
            display: block;
            width: 200px;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
            margin: 15px auto;
        }
        
        .about {
            margin-bottom: 40px;
            line-height: 1.8;
            font-size: 1.2rem;
        }
        
        .quote {
            font-style: italic;
            margin-top: 30px;
            padding: 15px;
            border-left: 3px solid #d4af37;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .music-controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .music-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
        }
        
        .music-btn:hover {
            background: rgba(212, 175, 55, 0.3);
            transform: scale(1.1);
        }
        
        .music-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #b0a07c;
        }
        
        .imperial-elements {
            position: absolute;
            z-index: 1;
            opacity: 0.1;
            font-size: 100px;
            color: #d4af37;
        }
        
        .element-1 {
            top: 10%;
            left: 10%;
            transform: rotate(15deg);
        }
        
        .element-2 {
            bottom: 10%;
            right: 10%;
            transform: rotate(-10deg);
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .content > * {
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
        }
        
        .logo { animation-delay: 0.2s; }
        .about { animation-delay: 0.5s; }
        .quote { animation-delay: 0.8s; }
        .music-controls { animation-delay: 1.1s; }
        .music-info { animation-delay: 1.4s; }
        
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 3rem;
            }
            
            .content {
                width: 90%;
                padding: 25px;
            }
            
            .about {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Имперские элементы декора -->
    <div class="imperial-elements element-1">
        <i class="fas fa-crown"></i>
    </div>
    <div class="imperial-elements element-2">
        <i class="fas fa-shield-alt"></i>
    </div>
    
    <!-- Основной контент -->
    <div class="content">
        <div class="logo">
            <h1>Lilcryy</h1>
        </div>
        
        <div class="about">
            <p>My name: Lilcryy</p>
            <p>My age: 15</p>
            <p>My country of Russia 🇷🇺</p>
            <p>My username: none</p>
            
            <div class="quote">
                "Россия - не просто страна, это состояние души. Это величие империи и глубина русской души, слитые воедино."
            </div>
        </div>
        
        <div class="music-controls">
            <div class="music-btn" id="playBtn">
                <i class="fas fa-play"></i>
            </div>
            <div class="music-btn" id="pauseBtn">
                <i class="fas fa-pause"></i>
            </div>
            <div class="music-btn" id="volUpBtn">
                <i class="fas fa-volume-up"></i>
            </div>
        </div>
        
        <div class="music-info">
            Играет: "Гимн Российской Империи"
        </div>
    </div>
    
    <!-- Аудио элемент -->
    <audio id="bgMusic" loop>
        <source src="https://new.zvuch.com/track/6809757" type="audio/mpeg">
    </audio>

    <script>
        // Автовоспроизведение музыки
        document.addEventListener('DOMContentLoaded', function() {
            const bgMusic = document.getElementById('bgMusic');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const volUpBtn = document.getElementById('volUpBtn');
            
            // Попытка автоматического воспроизведения
            bgMusic.volume = 0.4;
            
            // Обработка ошибки автовоспроизведения
            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Автовоспроизведение не удалось:", error);
                    // Показать кнопку play
                    playBtn.style.display = 'flex';
                });
            }
            
            // Кнопка воспроизведения
            playBtn.addEventListener('click', () => {
                bgMusic.play();
                playBtn.style.display = 'none';
                pauseBtn.style.display = 'flex';
            });
            
            // Кнопка паузы
            pauseBtn.addEventListener('click', () => {
                bgMusic.pause();
                playBtn.style.display = 'flex';
                pauseBtn.style.display = 'none';
            });
            
            // Кнопка увеличения громкости
            volUpBtn.addEventListener('click', () => {
                if(bgMusic.volume < 0.9) {
                    bgMusic.volume += 0.1;
                } else {
                    bgMusic.volume = 1.0;
                }
            });
            
            // Параллакс эффект для элементов
            document.addEventListener('mousemove', (e) => {
                const elements = document.querySelectorAll('.imperial-elements');
                elements.forEach(el => {
                    const speed = 0.01;
                    const x = (window.innerWidth - e.pageX * speed) / 20;
                    const y = (window.innerHeight - e.pageY * speed) / 20;
                    el.style.transform = `translate(${x}px, ${y}px) rotate(${el === elements[0] ? 15 : -10}deg)`;
                });
            });
        });
    </script>
</body>
</html>
